# =============================================================================
# Conv-FNO — Pressure Buildup (CO2 Sequestration)
# =============================================================================
# Expected test-set results (paper Table I.14b):
#   MRE = 0.0078 ± 0.0048,  R² = 0.990
# =============================================================================

defaults:
  - model_config
  - _self_

hydra:
  job:
    chdir: False
  run:
    dir: ./outputs/ufno_co2/${now:%Y-%m-%d}/${now:%H-%M-%S}

data:
  data_path: /lustre/fsw/coreai_climate_earth2/wdyab/physicsnemo_data
  variable: pressure
  input_file: null
  output_file: null
  normalize: false
  num_workers: 4
  val_metric: mre
  mask_enabled: true
  mask_channel: 0
  denormalize_fn: dnorm_dP

training:
  batch_size: 4
  epochs: 140
  initial_lr: 0.001
  checkpoint_dir: ./checkpoints
  validate_freq: 5
  early_stopping: true
  patience: 25
  use_amp: false
  use_graphs: true
  resume_from_checkpoint: null
  regime: full_mapping

optimizer:
  type: adam
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: step
  step_size: 10
  gamma: 0.85
  min_lr: 1.0e-6

logging:
  console_freq: 10
  use_tensorboard: true
  tensorboard_dir: ./tensorboard
  use_mlflow: false
  experiment_name: ufno_co2_convfno_pressure
  use_wandb: false

seed: 42

compute:
  device: cuda
  num_gpus: 8
  distributed: true
  benchmark: true
  deterministic: true
