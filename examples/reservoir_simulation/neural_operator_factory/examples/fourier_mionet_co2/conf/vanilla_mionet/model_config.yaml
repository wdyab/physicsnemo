# =============================================================================
# Vanilla MIONet — Model Configuration (CO2 Sequestration)
# =============================================================================
# Two-branch MIONet: branch1 = spatial (minimal), branch2 = MLP
# for scalar inputs, trunk = sinusoidal FNN.  No Fourier layers.
# Paper reference R2: sat=0.948, pres=0.961
# =============================================================================

arch:
  dimensions: 3d
  model: xdeeponet

  xfno:
    out_channels: 1
    width: 36
    padding: 8
    activation_fn: relu
    modes1: 10
    modes2: 10
    modes3: 10
    modes4: 6
    num_fno_layers: 4
    lifting_type: mlp
    lifting_layers: 1
    lifting_width: 36
    decoder_type: mlp
    decoder_layers: 1
    decoder_width: 128
    decoder_activation_fn: relu
    num_unet_layers: 0
    num_conv_layers: 0
    unet_type: custom
    unet_kernel_size: 3
    unet_dropout: 0.0
    conv_kernel_size: 3
    coord_features: true

  xdeeponet:
    variant: mionet
    width: 36
    padding: 8

    branch1:
      encoder: spatial
      num_fourier_layers: 0
      num_unet_layers: 0
      num_conv_layers: 1
      modes1: 12
      modes2: 12
      kernel_size: 3
      dropout: 0.0
      unet_impl: custom
      activation_fn: relu

    branch2:
      encoder: mlp
      hidden_width: 36
      num_layers: 3
      activation_fn: relu

    trunk:
      input_type: time
      hidden_width: 36
      num_layers: 6
      activation_fn: sin

    decoder_type: mlp
    decoder_width: 36
    decoder_layers: 0
    decoder_activation_fn: relu

loss:
  types: [relative_l2]
  weights: [1.0]
  reduction: mean

  derivative:
    enabled: true
    weight: 0.5
    dims: [dx]
    metric: null

  physics:
    mass_conservation:
      enabled: false
      weight: 0.0
      use_cell_volumes: false
