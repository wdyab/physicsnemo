# =============================================================================
# PI-Norne — Pressure Model Configuration
# =============================================================================
# 4D Temporal Neural Operator for pressure prediction on the Norne field.
# Uses Fourier + U-Net branch processors on 3D volumetric data
# (46 x 112 x 22 x 65 timesteps).
#
# Pressure is not a conserved quantity, so mass conservation loss is disabled.
#
# Norne grid: 46 x 112 x 22, 44,431 active cells (39.2%), 65 timesteps
# Input channels: 11 (PERMX, PERMZ, PORO, PORV, NTG, ACTNUM, xyz, t, WCID)
# Output: pressure (bar)
# =============================================================================

arch:
  dimensions: 4d
  model: xdeeponet

  xdeeponet:
    variant: tno
    width: 128
    padding: 8

    # Branch1: processes input fields (11 channels)
    # Pure Fourier spatial encoder for 3D volumetric data
    branch1:
      encoder: mlp
      num_fourier_layers: 6
      num_unet_layers: 0
      num_conv_layers: 0
      modes1: 10
      modes2: 10
      modes3: 10
      kernel_size: 3
      dropout: 0.0
      activation_fn: tanh
      internal_resolution: null

    # Branch2 (t-branch): processes previous solution state
    # Pure Fourier spatial encoder for 3D volumetric data
    branch2:
      encoder: mlp
      hidden_width: 128
      num_layers: 1
      num_fourier_layers: 6
      num_unet_layers: 0
      num_conv_layers: 0
      modes1: 10
      modes2: 10
      modes3: 10
      kernel_size: 3
      dropout: 0.0
      activation_fn: tanh
      internal_resolution: null

    # Trunk: tanh FNN for time coordinates, linear output (TNO style)
    trunk:
      input_type: grid
      hidden_width: 128
      num_layers: 8
      activation_fn: tanh
      output_activation: true

    # Decoder: temporal projection (width → K timesteps)
    decoder_type: mlp
    decoder_width: 128
    decoder_layers: 2
    decoder_activation_fn: tanh

# =============================================================================
# Pressure Loss Configuration
# =============================================================================
# relative_l2 data loss + derivative regularization (dx, dy, dz).
# Mass conservation is disabled for pressure (not a conserved quantity).
loss:
  types: [relative_l2]
  weights: [1.0]
  reduction: mean
  huber_delta: 1.0

  derivative:
    enabled: true
    weight: 0.5
    dims: [dx, dy, dz]
    metric: null

  physics:
    mass_conservation:
      enabled: false
      weight: 0.5
      use_cell_volumes: true
      metric: null
