# =============================================================================
# PI-Norne — Pressure FNO4D Model Configuration
# =============================================================================
# 4D Fourier Neural Operator for pressure prediction on the Norne field.
# Uses SpectralConv4d on volumetric data (46 x 112 x 22 x 65 timesteps).
# Feedback channel appends previous prediction as extra input channel.
#
# Norne grid: 46 x 112 x 22, 44,431 active cells (39.2%), 65 timesteps
# Input channels: 11 + 1 feedback = 12 during AR training
# Output: pressure (bar)
# =============================================================================

arch:
  dimensions: 4d
  model: xfno

  xfno:
    out_channels: 1
    width: 32
    padding: 8

    # Encoder (lifting)
    lifting_type: mlp
    lifting_layers: 2
    lifting_width: 32

    # Processing layers — 4D pure Fourier (no UNet/Conv for 4D)
    num_fno_layers: 4
    activation_fn: gelu

    # Fourier modes per dimension
    modes1: 8               # X (46 cells)
    modes2: 10              # Y (112 cells)
    modes3: 6               # Z (22 cells)
    modes4: 6               # T (65 timesteps, but L=3 window)

    # Decoder
    decoder_type: mlp
    decoder_layers: 1
    decoder_width: 128
    decoder_activation_fn: relu

    # 4D options
    coord_features: false

# =============================================================================
# Pressure Loss Configuration
# =============================================================================
loss:
  types: [relative_l2]
  weights: [1.0]

  derivative:
    enabled: true
    weight: 0.5
    dims: [dx, dy, dz]
    metric: null

  physics:
    mass_conservation:
      enabled: false
      weight: 0.5
      use_cell_volumes: true
      metric: null
