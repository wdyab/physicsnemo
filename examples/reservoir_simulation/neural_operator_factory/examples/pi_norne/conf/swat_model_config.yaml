# =============================================================================
# PI-Norne — Water Saturation (SWAT) Model Configuration
# =============================================================================
# 4D Temporal Neural Operator for water saturation prediction on the Norne
# field.  Uses Fourier + U-Net branch processors on 3D volumetric data
# (46 x 112 x 22 x 65 timesteps).
#
# Water saturation is a conserved quantity — mass conservation loss is enabled.
#
# Norne grid: 46 x 112 x 22, 44,431 active cells (39.2%), 65 timesteps
# Input channels: 11 (PERMX, PERMZ, PORO, PORV, NTG, ACTNUM, xyz, t, WCID)
# Output: water saturation (fraction, [0, 1])
# =============================================================================

arch:
  dimensions: 4d
  model: xdeeponet

  xdeeponet:
    variant: tno
    width: 128
    padding: 8

    # Branch1: processes input fields (11 channels)
    # Pure MLP branch (no spatial processing layers)
    branch1:
      encoder:
        type: mlp
        hidden_width: 64
        num_layers: 3
        activation_fn: tanh
      layers:
        num_fourier_layers: 0
        num_unet_layers: 0
        num_conv_layers: 0

    # Branch2 (t-branch): processes previous solution state
    # Pure MLP branch
    branch2:
      encoder:
        type: mlp
        hidden_width: 128
        num_layers: 1
        activation_fn: tanh
      layers:
        num_fourier_layers: 0
        num_unet_layers: 0
        num_conv_layers: 0

    # Trunk: tanh FNN for time coordinates, linear output (TNO style)
    trunk:
      input_type: grid
      hidden_width: 128
      num_layers: 8
      activation_fn: tanh
      output_activation: true

    # Decoder: temporal projection (width → K timesteps)
    decoder_type: mlp
    decoder_width: 128
    decoder_layers: 2
    decoder_activation_fn: sigmoid

# =============================================================================
# SWAT Loss Configuration
# =============================================================================
# relative_l2 data loss + derivative regularization (dx, dy, dz) +
# weak mass conservation with cell-volume weighting from grid-width channels.
loss:
  types: [l1]
  weights: [1.0]

  derivative:
    enabled: true
    weight: 0.5
    dims: [dx, dy, dz]
    metric: null

  physics:
    mass_conservation:
      enabled: true
      weight: 0.5
      use_cell_volumes: true
      metric: null
