# =============================================================================
# U-DeepONet — Model Configuration (CO2 Sequestration)
# =============================================================================
# U-Net enhanced DeepONet: 3 U-Net blocks in the branch, sinusoidal
# trunk for time encoding.  No Fourier layers.
#
# Width differs per variable: 64 for saturation (default here),
# 96 for pressure (overridden in pressure_training_config.yaml).
#
# Reference: Diab & Al Kobaisi (2024), Sci. Rep. 14, 21298.
#            https://doi.org/10.1038/s41598-024-72393-0
# =============================================================================

arch:
  dimensions: 3d
  model: xdeeponet

  # xfno section required by Hydra schema but not used
  xfno:
    out_channels: 1
    width: 36
    padding: 8
    activation_fn: relu
    modes1: 10
    modes2: 10
    modes3: 10
    modes4: 6
    num_fno_layers: 4
    lifting_type: mlp
    lifting_layers: 1
    lifting_width: 36
    decoder_type: mlp
    decoder_layers: 1
    decoder_width: 128
    decoder_activation_fn: relu
    num_unet_layers: 0
    num_conv_layers: 0
    unet_type: custom
    unet_kernel_size: 3
    unet_dropout: 0.0
    conv_kernel_size: 3
    coord_features: true

  xdeeponet:
    variant: u_deeponet
    width: 64
    padding: 8

    # Branch: 3 U-Net blocks in series (no Fourier layers)
    branch1:
      encoder: spatial
      num_fourier_layers: 0
      num_unet_layers: 3
      num_conv_layers: 0
      modes1: 12
      modes2: 12
      kernel_size: 3
      dropout: 0.0
      unet_impl: custom
      activation_fn: sin

    # Trunk: 10-layer sinusoidal FNN processing time only
    trunk:
      input_type: time
      hidden_width: 64
      num_layers: 10
      activation_fn: sin

    # Decoder: shallow FC projection
    decoder_type: mlp
    decoder_width: 64
    decoder_layers: 1
    decoder_activation_fn: relu

# Same loss as U-FNO paper: relative L2 + derivative (dx)
loss:
  types: [relative_l2]
  weights: [1.0]
  reduction: mean

  derivative:
    enabled: true
    weight: 0.5
    dims: [dx]
    metric: null

  physics:
    mass_conservation:
      enabled: false
      weight: 0.0
      use_cell_volumes: false
