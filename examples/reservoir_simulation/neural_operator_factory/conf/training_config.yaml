# Neural Operator Factory — Training Configuration

defaults:
  - model_config
  - _self_

hydra:
  job:
    chdir: False
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

data:
  # ---------------------------------------------------------------------------
  # Dataset Configuration
  # ---------------------------------------------------------------------------
  # The dataset files should match the dimensions specified in arch.dimensions
  # - 3d: expects (N, H, W, T, C) input, (N, H, W, T) output
  # - 4d: expects (N, X, Y, Z, T, C) input, (N, X, Y, Z, T) output
  
  data_path: /lustre/fsw/coreai_climate_earth2/wdyab/physicsnemo_data/norne #/lustre/fsw/coreai_climate_earth2/wdyab/physicsnemo_data
  
  # File naming (supports {mode} placeholder for train/val/test)
  # Option 1: CO2 convention - set variable, leave input_file/output_file null
  # Option 2: Custom files - set input_file and output_file patterns
  variable: pressure           # 'pressure' or 'saturation' 
  input_file: norne_{mode}_input.pt               # e.g., 'norne_{mode}_input.pt' for custom datasets
  output_file: norne_{mode}_pressure.pt              # e.g., 'norne_{mode}_output.pt' for custom datasets
  
  normalize: true
  num_workers: 2

  # ---------------------------------------------------------------------------
  # Validation Metric Configuration (dataset-agnostic)
  # ---------------------------------------------------------------------------
  # val_metric: Which metric to compute during validation.
  #   Choices: 'rmse', 'mae', 'mre', 'mpe', 'relative_l2'
  #   Default: 'rmse' (works for any dataset without assumptions).
  #   CO2 examples: 'mre' for pressure, 'mpe' for saturation.
  val_metric: rmse

  # ---------------------------------------------------------------------------
  # Spatial Masking (inactive cell exclusion)
  # ---------------------------------------------------------------------------
  # Masks inactive cells by auto-detecting the ACTNUM channel (binary, static,
  # identical across samples). Applied to validation metrics during training
  # and to all metrics during evaluation.
  mask:
    enabled: true

  denormalize_fn: null

training:

  # ---------------------------------------------------------------------------
  # Training Regime
  # ---------------------------------------------------------------------------
  # full_mapping:    Predict entire trajectory in one forward pass (default).
  # autoregressive:  Predict K timesteps from L context timesteps,
  #                  with two-phase training (teacher forcing then rollout).
  regime: autoregressive

  batch_size: 2
  epochs: 200                   # used by full_mapping only; ignored by autoregressive
  initial_lr: 0.001
  checkpoint_freq: 10
  checkpoint_dir: ./checkpoints
  validate_freq: 5
  early_stopping: true
  patience: 20
  use_amp: false
  use_graphs: true


  autoregressive:
    input_window: 1            # L: number of context timesteps fed to model
    output_window: 3           # K: timesteps predicted per step (DeepONet: any K; xFNO: L+K >= 2*time_modes)
    teacher_forcing_epochs: 160 # Phase 1: model sees ground-truth inputs (learns physics)
    rollout_epochs: 40         # Phase 2: model sees its own predictions (learns self-correction)
    max_rollout_steps: 4       # Max chained AR steps per iteration (rollout phase)
    gradient_checkpointing: true

optimizer:
  type: adam
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: step
  step_size: 10
  gamma: 0.85
  min_lr: 1.0e-6

logging:
  console_freq: 10
  use_tensorboard: true
  tensorboard_dir: ./tensorboard
  use_mlflow: false
  experiment_name: nof_training
  use_wandb: false

seed: 42

compute:
  device: cuda
  num_gpus: 8
  distributed: true
  benchmark: false
  deterministic: true
