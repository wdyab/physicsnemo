# Neural Operator Factory — Training Configuration

defaults:
  - model_config
  - _self_

hydra:
  job:
    chdir: False
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

data:
  # ---------------------------------------------------------------------------
  # Dataset Configuration
  # ---------------------------------------------------------------------------
  # The dataset files should match the dimensions specified in arch.dimensions
  # - 3d: expects (N, H, W, T, C) input, (N, H, W, T) output
  # - 4d: expects (N, X, Y, Z, T, C) input, (N, X, Y, Z, T) output
  
  data_path: /lustre/fsw/coreai_climate_earth2/wdyab/physicsnemo_data/norne #/lustre/fsw/coreai_climate_earth2/wdyab/physicsnemo_data
  
  # Variable name — used for checkpoint naming and metric selection, not file resolution.
  # Choices: 'pressure', 'saturation'
  variable: saturation

  # Input/output file patterns ({mode} is replaced with train/val/test).
  # Available Norne dataset files:
  #   Inputs:  norne_{mode}_a.pt  (or symlink norne_{mode}_input.pt)
  #   Outputs: norne_{mode}_pressure.pt  (pressure, single channel)
  #            norne_{mode}_swat.pt      (water saturation, single channel)
  #            norne_{mode}_sgas.pt      (gas saturation, single channel)
  #            norne_{mode}_u.pt         (all 3 channels — requires multi-output support)
  # For CO2 dataset: set input_file/output_file to null and use variable instead
  #   (resolves to dP_{mode}_a.pt / dP_{mode}_u.pt or sg_* automatically)
  input_file: norne_{mode}_a.pt
  output_file: norne_{mode}_swat.pt

  # z-score normalize inputs and outputs.
  # Recommended: true for pressure (large dynamic range), false for saturation (bounded [0,1]).
  normalize: false
  num_workers: 2

  # ---------------------------------------------------------------------------
  # Validation Metric Configuration (dataset-agnostic)
  # ---------------------------------------------------------------------------
  # val_metric: Which metric to compute during validation.
  #   Choices: 'rmse', 'mae', 'mre', 'mpe', 'relative_l2'
  #   Default: 'rmse' (works for any dataset without assumptions).
  #   CO2 examples: 'mre' for pressure, 'mpe' for saturation.
  val_metric: rmse

  # mask_enabled: Exclude inactive cells from loss and metrics.
  #   Auto-detects the best mask channel from inputs (priority order):
  #   1) ACTNUM channel (binary {0,1}, static across time)
  #   2) Non-zero channel fallback (static zero pattern across time)
  #   3) No mask (all cells active)
  #   If the mask varies across samples, it is constructed per-batch.
  mask_enabled: true

  # mask_channel: Explicit input channel index for the active-cell mask.
  #   null = auto-detect (recommended).  Set to an integer to override.
  #   Example: 5 for Norne ACTNUM, 0 for CO2 permeability.
  mask_channel: null

  # denormalize_fn: Name of a denormalization function to apply to
  #   predictions and targets before computing validation metrics.
  #   Choices: 'dnorm_dP' (CO2 pressure), null (no denormalization).
  #   Default: null (no denormalization — works for any dataset).
  denormalize_fn: null

training:
  batch_size: 2
  epochs: 100                   # used by full_mapping only; ignored if regime is autoregressive below 
  initial_lr: 0.001
  checkpoint_dir: ./checkpoints
  validate_freq: 5
  early_stopping: true
  patience: 20
  use_amp: false
  use_graphs: true
  resume_from_checkpoint: ./checkpoints/best_model_saturation_deeponet3d_tno_spatial.pth

  # ---------------------------------------------------------------------------
  # Training Regime
  # ---------------------------------------------------------------------------
  # full_mapping:    Predict entire trajectory in one forward pass (default).
  # autoregressive:  Predict K timesteps from L context timesteps.
  #   Three-stage training: teacher forcing -> pushforward -> rollout
  #   Works with any model type and any spatial dimensionality: 3d (CO2) and 4d (Norne)
  regime: autoregressive

  autoregressive:
    # L: number of context timesteps fed to the model as input.
    input_window: 1

    # K: number of timesteps the model predicts per forward pass.
    # DeepONet/TNO: any K value works (temporal bundling via trunk queries).
    # xFNO: requires L + K >= 2 * time_modes for proper spectral resolution.
    output_window: 3

    # Stage 1 -- Teacher Forcing: model always sees ground-truth input.
    # Teaches the underlying physics from clean signals.
    teacher_forcing_epochs: 5

    # Stage 2 -- Pushforward: short unrolled chains with live gradients.
    # Gradually increases unroll length (curriculum) to bridge the gap
    # between teacher forcing and free-running rollout.
    # Set to 0 to skip this stage and go directly to rollout.
    pushforward_epochs: 0

    # Stage 3 -- Rollout: free-running autoregressive sweep (detached feedback).
    # Each window sees the model's own (detached) predictions,
    # training the model to self-correct approximation errors.
    rollout_epochs: 175

    # Maximum number of pushforward unroll steps.
    # Curriculum linearly ramps from 1 to this value over pushforward_epochs.
    max_unroll: 5

    # Noise standard deviation injected into branch2 / feedback during training.
    # Positive values add Gaussian noise for robustness; 0 disables.
    # Set to 0.01 to 0.05 during rollout training to regularize model against error accumulation
    noise_std: 0.0

    # Feedback channel: append previous prediction as an extra input channel in autoregressive training.
    # With a TNO model, the feedback channel is appended to the main branch (branch1).
    # Set to false to disable. Set to true to enable with all other models in AR training.
    use_feedback_channel: false

    # Gradient checkpointing: trade compute (speed) for memory during pushforward.
    # Only applies to pushforward (live-gradient chains need it for memory).
    # Rollout and teacher forcing do not use it (each window is independent).
    gradient_checkpointing: false

    # Factor to reset learning rate at each stage transition.
    # 1.0 = no reset; < 1.0 = scale LR up relative to current schedule.
    lr_reset_factor: 1.0

optimizer:
  type: adam
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: step
  step_size: 10
  gamma: 0.85
  min_lr: 1.0e-6

logging:
  console_freq: 10
  use_tensorboard: true
  tensorboard_dir: ./tensorboard
  use_mlflow: false
  experiment_name: nof_training
  use_wandb: false

seed: 42

compute:
  device: cuda
  num_gpus: 8
  distributed: true
  benchmark: false
  deterministic: true
