# =============================================================================
# Model Architecture Configuration
# =============================================================================
#
# Supported model types:
#   - ufno: Fourier Neural Operator with U-Net (legacy)
#   - unet: Pure U-Net (legacy)
#   - deeponet: 2D DeepONet variants
#   - deeponet3d: 3D DeepONet variants (for volumetric data)
#
# DeepONet Variants (both 2D and 3D):
#   - deeponet: Basic DeepONet
#   - u_deeponet: DeepONet with U-Net branch layers
#   - fourier_deeponet: DeepONet with Fourier layers
#   - conv_deeponet: DeepONet with convolutional layers
#   - hybrid_deeponet: Combination of Fourier + U-Net + Conv
#   - mionet: Multiple-input operator network (2 branches)
#   - fourier_mionet: MIONet with Fourier layers
#
# Branch Layer Behavior:
#   - If num_fourier_layers > 0: UNet/Conv layers get Fourier residual connection
#   - If num_fourier_layers = 0: UNet/Conv layers are standalone
#
# =============================================================================

arch:
  # ---------------------------------------------------------------------------
  # Model Type Selection
  # ---------------------------------------------------------------------------
  model_type: deeponet3d  # Options: ufno, unet, deeponet, deeponet3d
  
  # ---------------------------------------------------------------------------
  # Legacy: U-FNO Configuration
  # ---------------------------------------------------------------------------
  ufno:
    out_channels: 1
    width: 36
    modes1: 10
    modes2: 10
    modes3: 10
    num_fno_layers: 3
    num_unet_layers: 3
    num_conv_layers: 0
    padding: 8
    conv_kernel_size: 3
    unet_kernel_size: 3
    unet_dropout: 0.0
    unet_type: physicsnemo
    activation_fn: relu
    lifting_type: mlp
    lifting_layers: 1
    lifting_width: 2
    decoder_type: mlp
    decoder_layers: 1
    decoder_width: 128
    decoder_activation_fn: relu
  
  # ---------------------------------------------------------------------------
  # Legacy: U-Net Configuration
  # ---------------------------------------------------------------------------
  unet:
    out_channels: 1
    unet_type: physicsnemo
    
    physicsnemo:
      kernel_size: 3
      stride: 1
      model_depth: 3
      feature_map_channels: [36, 36, 36]
      num_conv_blocks: 1
      conv_activation: relu
      conv_transpose_activation: relu
      padding: 1
      padding_mode: zeros
      pooling_type: MaxPool3d
      pool_size: 2
      normalization: batchnorm
      use_attn_gate: false
      gradient_checkpointing: false
    
    custom:
      kernel_size: 3
      dropout_rate: 0.0

  # ===========================================================================
  # 2D DeepONet Configuration
  # ===========================================================================
  # Input shape: (B, H, W, T, C)
  # Output shape: (B, H, W, T)
  
  deeponet:
    variant: u_deeponet
    width: 128
    padding: 8
    
    # Branch 1: Primary spatial encoder
    branch1:
      type: spatial           # 'spatial' or 'mlp'
      # in_channels: auto     # Inferred from input
      num_fourier_layers: 0   # 0 = pure UNet/Conv mode
      num_unet_layers: 3
      num_conv_layers: 0
      modes1: 12              # Fourier modes (H dimension)
      modes2: 12              # Fourier modes (W dimension)
      kernel_size: 3
      dropout: 0.0
      unet_impl: custom       # 'custom' or 'physicsnemo'
      activation_fn: sin
    
    # Branch 2: Secondary encoder (for MIONet variants only)
    branch2:
      type: mlp
      in_features: 5
      hidden_width: 64
      num_layers: 3
      activation_fn: relu
    
    # Trunk: Temporal/coordinate encoder
    trunk:
      input_type: grid        # 'time' (1D) or 'grid' (x, y, t = 3D)
      hidden_width: 128
      num_layers: 6
      activation_fn: sin
    
    # Decoder: Output projection
    decoder_type: mlp         # 'mlp' or 'conv'
    decoder_width: 128
    decoder_layers: 2
    decoder_activation_fn: relu

  # ===========================================================================
  # 3D DeepONet Configuration
  # ===========================================================================
  # Input shape: (B, X, Y, Z, T, C)
  # Output shape: (B, X, Y, Z, T)
  
  deeponet3d:
    variant: u_deeponet
    width: 64                 # Reduced for memory efficiency
    padding: 8
    
    # Branch 1: Primary 3D spatial encoder
    branch1:
      type: spatial           # 'spatial' or 'mlp'
      # in_channels: auto     # Inferred from input
      num_fourier_layers: 0   # 0 = pure UNet/Conv mode
      num_unet_layers: 2      # Fewer layers for 3D (memory)
      num_conv_layers: 0
      modes1: 8               # Fourier modes (X dimension)
      modes2: 8               # Fourier modes (Y dimension)
      modes3: 6               # Fourier modes (Z dimension)
      kernel_size: 3
      dropout: 0.0
      unet_impl: custom       # 'custom' or 'physicsnemo'
      activation_fn: sin
    
    # Branch 2: Secondary encoder (for MIONet variants only)
    branch2:
      type: mlp
      in_features: 5
      hidden_width: 64
      num_layers: 3
      activation_fn: relu
    
    # Trunk: Temporal/coordinate encoder
    trunk:
      input_type: grid        # 'time' (1D) or 'grid' (x, y, z, t = 4D)
      hidden_width: 128
      num_layers: 6
      activation_fn: sin
    
    # Decoder: Output projection
    decoder_type: mlp         # 'mlp' or 'conv'
    decoder_width: 128
    decoder_layers: 2
    decoder_activation_fn: relu

# =============================================================================
# Loss Function Configuration
# =============================================================================

loss:
  base_loss_type: relative_l2   # 'mse', 'l1', 'relative_l2', 'relative_l1'
  reduction: mean
  use_mask: true                # Mask inactive cells
  use_derivative: false
  derivative_weight: 0.5
  derivative_dim: dx

# =============================================================================
# Configuration Examples
# =============================================================================
#
# Example 1: Pure U-Net branch (original U-DeepONet)
#   branch1:
#     type: spatial
#     num_fourier_layers: 0
#     num_unet_layers: 3
#     num_conv_layers: 0
#
# Example 2: Pure Fourier branch (FNO-style)
#   branch1:
#     type: spatial
#     num_fourier_layers: 4
#     num_unet_layers: 0
#     num_conv_layers: 0
#
# Example 3: Hybrid U-FNO branch
#   branch1:
#     type: spatial
#     num_fourier_layers: 2    # 2 pure Fourier layers
#     num_unet_layers: 2       # 2 Fourier+UNet layers
#     num_conv_layers: 0
#
# Example 4: MIONet with two branches
#   variant: mionet
#   branch1:
#     type: spatial
#     num_unet_layers: 3
#   branch2:
#     type: mlp
#     in_features: 10
#     num_layers: 4
#
# Example 5: 3D Fourier DeepONet
#   model_type: deeponet3d
#   deeponet3d:
#     variant: fourier_deeponet
#     branch1:
#       num_fourier_layers: 3
#       num_unet_layers: 0
#       modes1: 8
#       modes2: 8
#       modes3: 6
#
# Example 6: FNO4D for volumetric problems
#   model_type: fno4d
#   fno4d:
#     width: 32
#     modes1: 8
#     modes2: 8
#     modes3: 6
#     modes4: 6
#     num_fno_layers: 4
#     coord_features: true
